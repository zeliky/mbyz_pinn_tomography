# Data config for baseline (legacy-compatible paths and normalization)
data_dir: ../inputData
train_path: ${data_dir}/ForLearning/
validation_path: ${data_dir}/ForValidation/
test_path: ${data_dir}/ForTest/
tof_path: ${data_dir}/TimeOfFlightData/

min_sos: 0.1
max_sos: 2.1
c_base_phys: 1.5  # physical fluid speed (same units as min_sos/max_sos); c_base kept as fallback
c_base: 1.5
min_tof: 0.0
max_tof: 1000.0

# If true, build dataset index from .mat files only (no PNG anatomy/tof filenames required)
index_from_mat_only: false

batch_size: 4
num_workers: 0
