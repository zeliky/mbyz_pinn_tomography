# Stage 0: initializer-only training (no operator/policy).
# Override initializer: python scripts/train_stage0.py initializer=sr_resnet_attention
# Backprojection + MONAI U-Net (build artifacts/backprojection_operator.npz first):
#   python scripts/train_stage0.py initializer=stage0_backproj_unet
defaults:
  - _self_
  - data: default
  - initializer: stage0_backproj_unet
  - training: stage0

seed: 42
device: cuda
experiment_name: stage0_initializer
