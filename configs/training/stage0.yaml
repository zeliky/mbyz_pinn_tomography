epochs: 50
lr: 0.001
loss: smooth_l1  # l1 | smooth_l1
checkpoint_dir: checkpoints/stage0
save_best: true
save_last: true
val_every: 1  # validate every N epochs
# Training logs: terminal_<run_id>.txt + output___<run_id>.html under log_dir or checkpoint_dir/runs/<run_id>
enable_html_report: true
log_dir: null  # null -> checkpoints/stage0/runs/<run_id>
