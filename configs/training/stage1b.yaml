stage: stage1b

# Physical SoS bounds (must match data min_sos/max_sos units)
# For data default (min_sos=0.1, max_sos=2.1) use 1.5/1.45/1.8; for mm/s use 1500/1450/1800
c_base_phys: 1.5
c_min_phys: 1.45
c_max_phys: 1.8

# Stage 0 checkpoint
checkpoint_path: checkpoints/stage0/best.pt
checkpoint_dir: checkpoints/stage1a
checkpoint_dir_1b: checkpoints/stage1b

search:
  method: powell
  max_iter: 100

alpha_search:
  min: 0.0
  max: 2.0

smooth_correction:
  grid_h: 8
  grid_w: 8
  init_scale: 0.0
  apply_gaussian: false
  sigma: 0.5

loss:
  type: huber
  delta: 0.01
  w_tof: 1.0
  w_smooth: 5.0
  w_bounds: 10.0
  w_anchor: 0.1

scale_factor: 1.0

# Which data split to use for calibration: train | validation | test
loader_split: validation
