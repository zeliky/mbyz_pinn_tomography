stage: stage1b

# Physical SoS bounds (same units as data min_sos/max_sos)
# Example: 1500/1450/1800 for mm/s; use 1.5/1.45/1.8 if data uses 0.1-2.1 range
c_base_phys: 1500.0
c_min_phys: 1450.0
c_max_phys: 1800.0

# Stage 0 checkpoint
checkpoint_path: checkpoints/stage0/best.pt
checkpoint_dir: checkpoints/stage1a
checkpoint_dir_1b: checkpoints/stage1b

search:
  method: powell
  max_iter: 100

alpha_search:
  min: 0.0
  max: 2.0

smooth_correction:
  grid_h: 8
  grid_w: 8
  init_scale: 0.0
  apply_gaussian: false
  sigma: 0.5

loss:
  type: huber
  delta: 0.01
  w_tof: 1.0
  w_smooth: 5.0
  w_bounds: 10.0
  w_anchor: 0.1

scale_factor: 1.0
