# Stage 1A: alpha-only calibration around frozen Stage 0.
# Override via Hydra: run_stage1b=false to skip Stage 1B; training=stage1b to use Stage 1B config.
defaults:
  - _self_
  - data: default
  - training: stage1a

run_stage1b: true  # set false to run only Stage 1A
seed: 42
device: cuda
experiment_name: stage1a_calibration
