[project]
name = "pinn-tomography"
version = "0.1.0"
description = "PINN tomography: one system with State, Operator, Initializer, Policy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "monai>=1.3.0",
    "torch-geometric>=2.4",
    "hydra-core>=1.3",
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "tqdm",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "mypy>=1.8",
    "pytest>=7.4",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1",
    "mypy>=1.8",
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tomo"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch_geometric.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
